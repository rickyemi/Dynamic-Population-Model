name: CI

# Runs on every push and pull request. The whole suite works on synthetic data, so CI needs no
# model exports and no secrets, which is what makes it safe on a public repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check the modules still match their notebooks
        # The modules in src/dpm are generated by tools/nb_to_module.py. This fails the build if
        # someone edited a module by hand, which is the one way the two copies can diverge.
        run: python tools/nb_to_module.py --check

      - name: Test
        run: pytest --cov=dpm --cov-report=term-missing

      - name: End to end self test
        run: dpm self-test
